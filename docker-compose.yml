name: carthage-escape

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carthage
      POSTGRES_PASSWORD: carthage
      POSTGRES_DB: carthage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carthage -d carthage"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: .
    image: carthage-escape-server:local
    environment:
      DATABASE_URL: postgres://carthage:carthage@db:5432/carthage
      BIND_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/public
      CONTENT_DIR: /app/content
      RUST_LOG: carthage_server=info,tower_http=info
      # Local-only default. Production sets a real secret (and COOKIE_SECURE=true behind HTTPS).
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
