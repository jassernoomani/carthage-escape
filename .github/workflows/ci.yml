name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carthage
          POSTGRES_PASSWORD: carthage
          POSTGRES_DB: carthage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carthage -d carthage"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://carthage:carthage@localhost:5432/carthage
      CARGO_TERM_COLOR: always
      # Compile queries against the committed .sqlx/ cache: fails if someone forgot
      # `cargo sqlx prepare -- --all-targets` after changing a query.
      SQLX_OFFLINE: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Generated TS types are up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain web/src/generated)" ]; then
            echo "::error::web/src/generated is stale. Run 'cargo test' in server/ and commit the result."
            git status --porcelain web/src/generated
            exit 1
          fi

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Docker image + E2E
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: carthage-escape-server:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 1
          done
          echo "::error::server did not become healthy"
          docker compose logs server
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Two players + host play through the lobby
        run: npm run e2e
        working-directory: web
      - name: Server logs
        if: failure()
        run: docker compose logs server
